<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NE능률 지사 참여 홈페이지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --ink:#17233d; --muted:#6a7385; --line:#e3e7ef; --paper:#eef1f6; --surface:#fff;
    --primary:#1f3a68; --accent:#2563c9; --accent-soft:#eaf1fd;
    --ok:#1f7a52; --ok-soft:#e7f5ee; --warn:#a9670e; --warn-soft:#fef3e2;
    --danger:#c22f3e; --danger-soft:#fdecee; --closed:#6a7385; --closed-soft:#eef1f6;
    --shadow:0 1px 2px rgba(20,35,70,.06),0 8px 24px rgba(20,35,70,.06);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:36px 18px 80px}

  header.hero{text-align:center;margin-bottom:30px}
  .hero .logo{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;font-weight:800;font-size:13px;letter-spacing:.06em;padding:7px 14px;border-radius:999px;margin-bottom:14px}
  .hero h1{margin:0 0 8px;font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--primary)}
  .hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .btn{font:inherit;font-weight:700;font-size:14.5px;border-radius:11px;cursor:pointer;border:1.5px solid transparent;padding:12px 18px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:#1f57b8}
  .btn.primary:disabled{background:#b7c4dc;cursor:not-allowed}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.danger{background:#fff;border-color:#f0c6cb;color:var(--danger)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
  input,select,textarea{font:inherit}

  .surveys{display:flex;flex-direction:column;gap:14px}
  .svy{padding:20px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;transition:.15s}
  .svy:hover{border-color:#c9d6ec}
  .svy .info{flex:1;min-width:240px}
  .svy .top-line{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .svy h2{margin:0;font-size:16.5px;font-weight:800;color:var(--primary);letter-spacing:-.01em}
  .badge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .badge.open{background:var(--ok-soft);color:var(--ok)}
  .badge.closed{background:var(--closed-soft);color:var(--closed)}
  .badge.soon{background:var(--warn-soft);color:var(--warn)}
  .svy .desc{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .svy .period{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
  .svy .period b{color:var(--ink)}
  .svy.closed-row{opacity:.62}
  .svy .go{white-space:nowrap}
  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14.5px}

  footer{margin-top:34px;text-align:center;font-size:12.5px;color:var(--muted)}
  footer button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:4px}
  footer button:hover{color:var(--accent)}

  /* admin */
  .admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .admin-head h2{margin:0;font-size:16px;font-weight:800;color:var(--primary)}
  .chip{background:#f3e8fd;color:#7239c9;font-weight:700;font-size:12px;padding:4px 10px;border-radius:999px}
  .aform{padding:18px 20px;border-bottom:1px solid var(--line);background:#fafbfd}
  .aform .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:600px){.aform .grid{grid-template-columns:1fr}}
  .field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .aform .actions{display:flex;gap:10px;flex-wrap:wrap}
  .alist{padding:8px 20px 18px}
  .aitem{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .aitem:last-child{border-bottom:0}
  .aitem .t{flex:1;min-width:200px}
  .aitem .t .nm{font-weight:700;font-size:14.5px}
  .aitem .t .u{font-size:12px;color:var(--muted);word-break:break-all}
  .aitem .ops{display:flex;gap:6px;flex-wrap:wrap}
  .gate-err{display:none;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600;padding:10px 13px;border-radius:9px;margin:0 20px 14px}
  .gate-err.show{display:block}
  .pw-box{padding:20px}
  .pw-box .row{display:flex;gap:10px}
  .pw-box input{flex:1;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px}
  .pw-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .note{font-size:12.5px;color:var(--muted);padding:12px 20px 16px;line-height:1.55}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:100;font-size:14px;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  section.view{display:none}
  section.view.active{display:block}
</style>
</head>
<body>
  <a href="https://neungyule-sales.github.io/" style="position:fixed;top:12px;right:12px;z-index:60;background:#fff;border:1.5px solid #e3e7ef;border-radius:999px;padding:8px 15px;font-weight:700;font-size:13px;color:#1f3a68;text-decoration:none;box-shadow:0 1px 3px rgba(20,35,70,.1);">참여 홈 ↗</a>
<div class="wrap">

  <header class="hero">
    <div class="logo">NE능률 · 지사 참여</div>
    <h1>NE능률 지사 참여 홈페이지</h1>
    <p>진행 중인 수요 조사와 참여 링크를 한곳에서 확인하세요.<br />이 페이지를 즐겨찾기해 두시면 새 조사가 열릴 때마다 여기에서 바로 참여할 수 있습니다.</p>
  </header>

  <!-- 공개 목록 -->
  <section id="view-list" class="view active">
    <div class="surveys" id="surveyList">
      <div class="card empty">목록을 불러오는 중…</div>
    </div>
    <footer>
      NE능률 영업기획 · 지사 지원<br />
      <button onclick="openAdmin()">관리자 페이지</button>
    </footer>
  </section>

  <!-- 관리자 -->
  <section id="view-admin" class="view">
    <div class="card">
      <div class="admin-head">
        <h2>참여 링크 관리 <span class="chip">관리자</span></h2>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost sm" onclick="backToList()">← 홈으로</button>
        </div>
      </div>

      <div id="pwArea" class="pw-box">
        <div class="gate-err" id="pwErr" style="margin:0 0 12px;"></div>
        <div class="row">
          <input id="adminPw" type="password" placeholder="관리자 비밀번호" />
          <button class="btn primary" onclick="loginAdmin()">확인</button>
        </div>
      </div>

      <div id="adminArea" style="display:none;">
        <div class="aform">
          <div class="grid">
            <div class="field"><label>조사 제목 *</label><input id="fTitle" type="text" placeholder="예: 26년 하반기 영어 연구용 수요 조사" /></div>
            <div class="field"><label>참여 링크(URL) *</label><input id="fUrl" type="url" placeholder="https://..." /></div>
            <div class="field"><label>기간 안내</label><input id="fPeriod" type="text" placeholder="예: 8/10(월) ~ 8/21(금)" /></div>
            <div class="field"><label>상태</label>
              <select id="fStatus">
                <option value="open">진행중</option>
                <option value="soon">오픈 예정</option>
                <option value="closed">마감</option>
              </select>
            </div>
          </div>
          <div class="field" style="margin-bottom:12px;"><label>설명 (한 줄)</label><input id="fDesc" type="text" placeholder="예: 생산유지/선택적 유통 품목별 필요 수량을 입력해 주세요." /></div>
          <div class="actions">
            <button class="btn primary" id="fSaveBtn" onclick="saveForm()">링크 추가</button>
            <button class="btn ghost" id="fCancelBtn" onclick="resetForm()" style="display:none;">취소</button>
          </div>
        </div>
        <div class="alist" id="adminList"></div>
        <p class="note">변경 사항은 저장 즉시 모든 지사에게 반영됩니다. "위/아래"로 노출 순서를 조정할 수 있습니다.</p>
      </div>
    </div>
    <footer></footer>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 설정 ============ */
const API_URL = "https://script.google.com/macros/s/AKfycbx5vEGtA3XLgO8h4YAW5FxhyHsRV3VljNySw1SIfrFFTdJuMfHBCTqi5Gq9PyhJmtcO/exec";
const PORTAL_KEY = "PORTAL-CONFIG";
const ADMIN_PW = "neungyule12!";

// 백엔드에 목록이 아직 없을 때 표시되는 기본 링크
const DEFAULT_LINKS = [
  {
    id: "r2601",
    title: "26년 하반기 ~ 27년 상반기(신학기) 영어 연구용 수요 조사",
    desc: "생산유지 / 선택적 유통 품목별 연구용 필요 수량을 입력해 주세요.",
    period: "",
    status: "open",
    url: "https://neungyule-sales.github.io/teachingbooksresearch/"
  }
];

/* ============ 저장소 ============ */
async function loadLinks(){
  try{
    const r = await fetch(API_URL + "?action=get&code=" + encodeURIComponent(PORTAL_KEY));
    const j = await r.json();
    if(j && j.code && j.qty && Array.isArray(j.qty.links)) return j.qty.links;
  }catch(e){}
  return null; // 저장된 목록 없음
}
async function saveLinks(links){
  const payload = { code: PORTAL_KEY, name: "portal", qty: { links }, submitted: true, savedAt: new Date().toISOString() };
  const r = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
  const j = await r.json();
  if(!j || !j.ok) throw new Error("save failed");
}

/* ============ 공통 ============ */
let LINKS = [];
let savedExists = false;
let editingId = null;
let isAuthed = false;

function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600);
}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function show(v){
  document.getElementById("view-list").classList.toggle("active", v==="list");
  document.getElementById("view-admin").classList.toggle("active", v==="admin");
  window.scrollTo(0,0);
}
function statusBadge(s){
  if(s==="closed") return '<span class="badge closed">마감</span>';
  if(s==="soon") return '<span class="badge soon">오픈 예정</span>';
  return '<span class="badge open">진행중</span>';
}

/* ============ 공개 목록 ============ */
function renderList(){
  const el = document.getElementById("surveyList");
  if(!LINKS.length){
    el.innerHTML = '<div class="card empty">현재 진행 중인 조사가 없습니다.<br/>새 조사가 열리면 이곳에 게시됩니다.</div>';
    return;
  }
  el.innerHTML = LINKS.map(l=>{
    const closed = l.status==="closed";
    const soon = l.status==="soon";
    const btn = closed
      ? '<button class="btn ghost go" disabled style="opacity:.55;cursor:not-allowed;">마감됨</button>'
      : soon
        ? '<button class="btn ghost go" disabled style="opacity:.7;cursor:not-allowed;">오픈 예정</button>'
        : `<a class="btn primary go" href="${esc(l.url)}" style="text-decoration:none;display:inline-block;">참여하기 →</a>`;
    return `<div class="card svy ${closed?'closed-row':''}">
      <div class="info">
        <div class="top-line">${statusBadge(l.status)}<h2>${esc(l.title)}</h2></div>
        ${l.desc?`<p class="desc">${esc(l.desc)}</p>`:""}
        ${l.period?`<p class="period">기간: <b>${esc(l.period)}</b></p>`:""}
      </div>
      ${btn}
    </div>`;
  }).join("");
}
async function init(){
  const saved = await loadLinks();
  if(saved){ LINKS = saved; savedExists = true; }
  else { LINKS = DEFAULT_LINKS.slice(); savedExists = false; }
  renderList();
}

/* ============ 관리자 ============ */
function openAdmin(){
  show("admin");
  if(isAuthed){
    document.getElementById("pwArea").style.display="none";
    document.getElementById("adminArea").style.display="";
    renderAdmin();
  } else {
    document.getElementById("pwArea").style.display="";
    document.getElementById("adminArea").style.display="none";
    setTimeout(()=>document.getElementById("adminPw").focus(),50);
  }
}
function backToList(){ renderList(); show("list"); }
function loginAdmin(){
  const err=document.getElementById("pwErr");
  if(document.getElementById("adminPw").value !== ADMIN_PW){
    err.textContent="비밀번호가 올바르지 않습니다."; err.classList.add("show"); return;
  }
  err.classList.remove("show");
  document.getElementById("adminPw").value="";
  isAuthed = true;
  document.getElementById("pwArea").style.display="none";
  document.getElementById("adminArea").style.display="";
  renderAdmin();
}
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && document.activeElement && document.activeElement.id==="adminPw") loginAdmin();
});

function renderAdmin(){
  const el=document.getElementById("adminList");
  if(!LINKS.length){ el.innerHTML='<div class="empty" style="padding:30px;">등록된 링크가 없습니다. 위에서 추가하세요.</div>'; return; }
  el.innerHTML = LINKS.map((l,i)=>`
    <div class="aitem">
      <div class="t">
        <div class="nm">${statusBadge(l.status)} ${esc(l.title)}</div>
        <div class="u">${esc(l.url)}${l.period?` · ${esc(l.period)}`:""}</div>
      </div>
      <div class="ops">
        <button class="btn ghost sm" onclick="moveLink(${i},-1)" ${i===0?"disabled":""}>위</button>
        <button class="btn ghost sm" onclick="moveLink(${i},1)" ${i===LINKS.length-1?"disabled":""}>아래</button>
        <button class="btn ghost sm" onclick="editLink('${esc(l.id)}')">수정</button>
        <button class="btn danger sm" onclick="delLink('${esc(l.id)}')">삭제</button>
      </div>
    </div>`).join("");
}
function resetForm(){
  editingId=null;
  ["fTitle","fUrl","fPeriod","fDesc"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fStatus").value="open";
  document.getElementById("fSaveBtn").textContent="링크 추가";
  document.getElementById("fCancelBtn").style.display="none";
}
function editLink(id){
  const l=LINKS.find(x=>x.id===id); if(!l) return;
  editingId=id;
  document.getElementById("fTitle").value=l.title||"";
  document.getElementById("fUrl").value=l.url||"";
  document.getElementById("fPeriod").value=l.period||"";
  document.getElementById("fDesc").value=l.desc||"";
  document.getElementById("fStatus").value=l.status||"open";
  document.getElementById("fSaveBtn").textContent="수정 저장";
  document.getElementById("fCancelBtn").style.display="";
  window.scrollTo({top:0,behavior:"smooth"});
}
async function saveForm(){
  const title=document.getElementById("fTitle").value.trim();
  const url=document.getElementById("fUrl").value.trim();
  if(!title || !url){ toast("제목과 링크(URL)는 필수입니다."); return; }
  if(!/^https?:\/\//.test(url)){ toast("링크는 http:// 또는 https:// 로 시작해야 합니다."); return; }
  const data={
    title, url,
    period:document.getElementById("fPeriod").value.trim(),
    desc:document.getElementById("fDesc").value.trim(),
    status:document.getElementById("fStatus").value
  };
  if(editingId){
    const i=LINKS.findIndex(x=>x.id===editingId);
    if(i>-1) LINKS[i]={...LINKS[i],...data};
  } else {
    LINKS.push({id:"s"+Date.now(), ...data});
  }
  await persist("저장되었습니다.");
  resetForm(); renderAdmin();
}
async function delLink(id){
  const l=LINKS.find(x=>x.id===id);
  if(!l) return;
  if(!confirm(`"${l.title}" 링크를 삭제할까요?`)) return;
  LINKS=LINKS.filter(x=>x.id!==id);
  await persist("삭제되었습니다.");
  renderAdmin();
}
async function moveLink(i,d){
  const j=i+d; if(j<0||j>=LINKS.length) return;
  [LINKS[i],LINKS[j]]=[LINKS[j],LINKS[i]];
  await persist("순서가 변경되었습니다.");
  renderAdmin();
}
async function persist(okMsg){
  try{ await saveLinks(LINKS); savedExists=true; toast(okMsg); }
  catch(e){ toast("저장에 실패했습니다. 잠시 후 다시 시도해 주세요."); }
}

init();
</script>
</body>
</html>
